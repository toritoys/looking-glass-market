    <script>
      window.addEventListener('error', function(e) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#f55;font-family:monospace;font-size:0.85rem;padding:40px;z-index:9999;white-space:pre-wrap;text-align:left;';
        d.textContent = 'JS Error:\n' + (e.message || '') + '\n' + (e.filename || '') + ':' + e.lineno;
        document.body.appendChild(d);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fa0;font-family:monospace;font-size:0.85rem;padding:40px;z-index:9999;white-space:pre-wrap;text-align:left;';
        d.textContent = 'Unhandled Promise:\n' + (e.reason || '');
        document.body.appendChild(d);
      });
    </script>
  </body>
